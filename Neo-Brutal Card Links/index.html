<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Saver App UI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Retro Neo-Brutalist Look -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Lexend:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fun Neo-brutalist Background Elements -->
    <div class="bg-circle bg-circle-pink"></div>
    <div class="bg-circle bg-circle-purple"></div>

    <!-- Main Phone Frame Container -->
    <div class="phone-container">
        <!-- Top Header Navigation -->
        <div class="top-nav">
            <!-- Gear Icon -->
            <button class="nav-btn btn-square">
                <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <div class="nav-right">
                <!-- Add Folder Icon -->
                <button class="nav-btn btn-square">
                    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                </button>
                <!-- Search Icon -->
                <button class="nav-btn btn-square">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
            </div>
        </div>

        <!-- Hero Title -->
        <header class="app-header">
            <h1>Save now.<br>Find anytime.</h1>
        </header>

        <!-- Link Input Action Bar -->
        <div class="input-container">
            <div class="input-wrapper">
                <span class="hash-symbol">#</span>
                <input type="text" placeholder="Paste link to save" disabled>
                <!-- Copy Icon -->
                <button class="copy-btn">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
            </div>
            <!-- Plus Icon -->
            <button class="add-btn">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </div>

        <!-- Collections Section -->
        <section class="collections-section">
            <h2>My Collections</h2>
            
            <div class="grid-container">
                
                <!-- Card 1: Unsorted -->
                <div class="folder-card">
                    <div class="folder-tab bg-grey"></div>
                    <div class="card-content">
                        <div class="icon-square bg-light-grey">
                            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                        </div>
                        <span class="link-count">1 link</span>
                        <h3 class="folder-title">Unsorted</h3>
                    </div>
                </div>

                <!-- Card 2: Must watch -->
                <div class="folder-card">
                    <div class="folder-tab bg-green"></div>
                    <div class="card-content">
                        <div class="icon-square bg-light-green">
                            <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        </div>
                        <span class="link-count">57 links</span>
                        <h3 class="folder-title">Must watch</h3>
                    </div>
                </div>

                <!-- Card 3: Learning & Research -->
                <div class="folder-card">
                    <div class="folder-tab bg-yellow"></div>
                    <div class="card-content">
                        <div class="icon-square bg-light-yellow">
                            <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                        </div>
                        <span class="link-count">24 links<br>2 folders</span>
                        <h3 class="folder-title">Learning & Research</h3>
                    </div>
                </div>

                <!-- Card 4: Coffee & Chill Spots -->
                <div class="folder-card">
                    <div class="folder-tab bg-lime"></div>
                    <div class="card-content">
                        <div class="icon-square bg-light-lime">
                            <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
                        </div>
                        <span class="link-count">7 links</span>
                        <h3 class="folder-title">Coffee & Chill Spots</h3>
                    </div>
                </div>

                <!-- Card 5: Travel plan -->
                <div class="folder-card">
                    <div class="folder-tab bg-pink"></div>
                    <div class="card-content">
                        <div class="icon-square bg-light-pink">
                            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                        </div>
                        <span class="link-count">13 links</span>
                        <h3 class="folder-title">Travel plan</h3>
                    </div>
                </div>

                <!-- Card 6: Weekend Recipes -->
                <div class="folder-card">
                    <div class="folder-tab bg-purple"></div>
                    <div class="card-content">
                        <div class="icon-square bg-light-purple">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        </div>
                        <div class="badge-row">
                            <span class="link-count">7 links</span>
                            <span class="new-badge">NEW</span>
                        </div>
                        <h3 class="folder-title">Weekend Recipes</h3>
                    </div>
                </div>

            </div>
        </section>

    </div>

</body>
</html>
