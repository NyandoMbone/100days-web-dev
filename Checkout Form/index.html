<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="checkout-container">
    
    <!-- Left Section: Payment Form -->
    <div class="form-section">
      <h2>Checkout</h2>
      <p class="subtitle">Enter your credit card details to complete the order</p>
      
      <form>
        <div class="input-group">
          <label for="card-name">Card Holder Name</label>
          <input type="text" id="card-name" placeholder="John Smith">
        </div>

        <div class="input-group">
          <label for="card-number">Card Number</label>
          <div class="card-number-wrapper">
            <span class="card-icon">🔸</span>
            <input type="text" id="card-number" placeholder="XXXX XXXX XXXX XXXX">
          </div>
        </div>

        <div class="row">
          <div class="input-group">
            <label for="expire">Expire Date</label>
            <input type="text" id="expire" placeholder="XX/XX">
          </div>
          <div class="input-group">
            <label for="cvv">CVV <span class="info-icon">ⓘ</span></label>
            <input type="text" id="cvv" placeholder="XXX">
          </div>
        </div>

        <button type="submit" class="pay-btn">Pay</button>
      </form>

      <p class="encryption-text">🔒 Your credit card information is encrypted</p>
    </div>

    <!-- Right Section: Order Summary & Shipping Info -->
    <div class="summary-section">
      
      <div class="summary-box">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span>$548</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>$20</span>
        </div>
        <div class="summary-row">
          <span>Tax</span>
          <span>$30</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span>$598</span>
        </div>
      </div>

      <div class="shipping-box">
        <h3>Shipping Info</h3>
        <div class="info-card">
          <p>Some address, 00239, Treesous</p>
          <p>email@email.com</p>
          <p>+00011122203</p>
        </div>
      </div>

      <a href="#" class="back-link">← Back to cart</a>
    </div>

  </div>

</body>
</html>
