<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Option Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h3>Select your option</h3>
        </div>
        
        <div class="options">
            <div>
                <input type="radio" name="option" id="opt1">
                <label for="opt1" class="option-label">
                    <span class="dot"></span>
                    Option 1
                </label>
            </div>

            <div>
                <input type="radio" name="option" id="opt2" checked>
                <label for="opt2" class="option-label">
                    <span class="dot"></span>
                    Option 2
                </label>
            </div>

            <div>
                <input type="radio" name="option" id="opt3">
                <label for="opt3" class="option-label">
                    <span class="dot"></span>
                    Option 3
                </label>
            </div>

            <div>
                <input type="radio" name="option" id="opt4">
                <label for="opt4" class="option-label">
                    <span class="dot"></span>
                    Option 4
                </label>
            </div>
        </div>
    </div>

</body>
</html>
