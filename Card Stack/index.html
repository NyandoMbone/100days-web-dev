<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>simple card stack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- simplified structure: one wrapper, three cards -->
  <div class="general">
    <div class="card one">World</div>
    <div class="card two"><img src="planet-earth.png" alt="planet-earth"></div>
    <div class="card three">Hello</div>
  </div>

  <!-- tiny instruction  -->
  <div style="position:fixed; bottom:20px; left:0; right:0; text-align:center; font-size:0.9rem; color:#555; opacity:0.7; pointer-events:none;">
    click or tap the cards
  </div>
</body>
</html>
