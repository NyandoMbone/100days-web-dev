<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Feedback Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="review-card">
        <!-- Star Rating Group -->
        <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5">
            <label for="star5">&#9733;</label>
            
            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4">&#9733;</label>
            
            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3">&#9733;</label>
            
            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2">&#9733;</label>
            
            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1">&#9733;</label>

            <!-- Dynamic Feedback Messages linked via CSS -->
            <div class="feedback-text text-default">Select a rating</div>
            <div class="feedback-text text-1">Terrible</div>
            <div class="feedback-text text-2">Bad</div>
            <div class="feedback-text text-3">It is okay</div>
            <div class="feedback-text text-4">It is awesome</div>
            <div class="feedback-text text-5">Exceptional!</div>
        </div>

        <!-- Textarea Input Area -->
        <textarea class="experience-input" placeholder="Describe your experience.."></textarea>

        <!-- Submit Button -->
        <button class="post-btn">POST</button>
    </div>

</body>
</html>
