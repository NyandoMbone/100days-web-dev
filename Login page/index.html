<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Font Awesome Link for Social Icons & Eye Icon -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="styles.css">
    
    
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your account</p>

        <form>
            <!-- Streamlined down to only username/email for the login form -->
            <div class="input-group">
                <input type="email" placeholder="username@gmail.com" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#" class="forgot-pass">Forgot password?</a>
            </div>
        </form>

        <div class="divider">Or continue with</div>

        <div class="social-login">
            <button class="social-btn" aria-label="Sign in with Google">
                <img src="search.png">
            </button>
            <button class="social-btn" aria-label="Sign in with Apple">
                <img src="apple.png">
            </button>
            <button class="social-btn" aria-label="Sign in with Facebook">
                <img src="facebook.png">
            </button>
        </div>

        <!-- Links the user back to your register form flow -->
        <p class="footer-text">Don't have an account? <a href="#" class="sign-up">Sign up</a></p>
    </div>

</body>
</html>
