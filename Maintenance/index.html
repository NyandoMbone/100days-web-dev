<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Down for Maintenance</title>
    <!-- FontAwesome for the social media icons at the bottom -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="maintenance-container">
        
        <!-- Header / Logo -->
        <header class="logo-area">
            <div class="logo">
                <span class="logo-icon"></span>
                <span class="logo-text">site.com</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <h1>The site is currently<br>down for maintenance</h1>
            <p class="subtext">We apologize for any inconveniences caused.<br>we've almost done.</p>
            
            <!-- Graphic Illustration -->
            <div class="illustration-container">
                <div class="wire blue-wire">
                    <div class="plug-male"></div>
                </div>
                <div class="wire green-wire">
                    <div class="plug-female"></div>
                </div>
            </div>
        </main>

        <!-- Footer Contact Info -->
        <footer class="footer-contacts">
            <div class="contact-info">
                <span>You can contact us:</span>
                <span class="contact-item">Phone: <strong>+0 (000) 000-00-80</strong></span>
                <span class="contact-item">Email: <strong>tech@site.com</strong></span>
            </div>
            <div class="social-icons">
                <a href="#" aria-label="Facebook"><img src="facebook.png" alt="facebook logo" class="first"></a>
                <a href="#" aria-label="WhatsApp"><img src="whatsapp.png" alt="whatsapp logo" class="sec" ></a>
                <a href="#" aria-label="Instagram"><img src="instagram.png" alt="instagram logo" class="third"></a>
                <a href="#" aria-label="Telegram"><img src="telegram.png" alt="telegram logo" class="fourth"></a>
            </div>
        </footer>

    </div>

</body>
</html>
