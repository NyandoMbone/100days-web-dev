<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Responsive Blog Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <section class="paper border shadow shadow-large">
      <h1>
        <a href="#">Nyando's Flower Blog</a>
      </h1>
        <ul class="card-list">
          <li class="card">
            <img src="https://i.pinimg.com/736x/ca/cb/d0/cacbd09433aeee9ceb84a952dae25c11.jpg" alt="Peony flowers">
            <h2>
              <a href="#" class="caption">Peony</a>
            </h2>
          </li>
          <li class="card">
            <img src="https://i.pinimg.com/1200x/8a/51/c3/8a51c3bebfa8c4de00b451e3e4512825.jpg" alt="Lily flowers">
            <h2>
              <a href="#" class="caption">Lily</a>
            </h2>
          </li>
          <li class="card">
            <img src="https://i.pinimg.com/736x/a0/47/49/a047498c0760dadc4e6498c8e7858fff.jpg" alt="Tulip folwers">
            <h2>
              <a href="#" class="caption">Tulips</a>
            </h2>
          </li>
          <li class="card">
            <img src="https://i.pinimg.com/736x/99/d4/55/99d455ba0392f03210e53905c91f53f8.jpg" alt="Orchid flowers">
            <h2>
              <a href="#" class="caption">Orchids</a>
            </h2>
          </li>
          <li class="card">
            <img src="https://i.pinimg.com/736x/68/84/49/688449f5dc29e121beee5bab1ae8c220.jpg" alt="Camellia flower">
            <h2>
              <a href="#" class="caption">Camellia</a>
            </h2>
          </li>
          <li class="card">
            <img src="https://i.pinimg.com/736x/9e/22/e4/9e22e4634180ae8c4c184a0a2ac70ae8.jpg" alt="Jasmine flowers">
            <h2>
              <a href="#" class="caption">Jasmine</a>
            </h2>
          </li>
      </ul>
    </section>
  </div>
</body>
</html>
