<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Destinations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    
    <!-- Skeleton Loading Travel Card -->
    <div class="card skeleton">
      <div class="card-image skeleton-image"></div>
      <div class="card-content">
        <div class="skeleton-header-row">
          <div class="skeleton-text skeleton-title"></div>
          <div class="skeleton-text skeleton-price"></div>
        </div>
        <div class="skeleton-text skeleton-body"></div>
      </div>
    </div>

    <!-- Active Content Travel Card -->
    <div class="card">
      <div class="card-image" style="background-image: url('https://i.pinimg.com/736x/84/56/6d/84566d81b4976be822e66e022fc25591.jpg');">
        <!-- Optional badge like 'Trending' or 'Featured' can go here -->
      </div>
      <div class="card-content">
        <div class="card-header-row">
          <h2 class="card-title">Bali, Indonesia</h2>
          <span class="card-price">$1,200</span>
        </div>
        <p class="card-description">
          Explore serene volcanic mountains, iconic rice paddies, and pristine beaches...
        </p>
      </div>
    </div>

  </div>

</body>
</html>
