<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    
    <!-- Home Item -->
    <div class="nav-item">
      <input type="radio" name="nav-group" id="home" checked>
      <label for="home">
        <div class="icon-wrapper">
          <!-- Custom SVG Icon to match the image -->
          <svg class="icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
        <span class="nav-label">Home</span>
      </label>
    </div>

    <!-- Search Item -->
    <div class="nav-item">
      <input type="radio" name="nav-group" id="search">
      <label for="search">
        <div class="icon-wrapper">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <span class="nav-label">Search</span>
      </label>
    </div>

    <!-- Reels Item -->
    <div class="nav-item">
      <input type="radio" name="nav-group" id="reels">
      <label for="reels">
        <div class="icon-wrapper">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zm-6.75 11.25V9.75L16 12.5l-4.75 2.75z"/></svg>
        </div>
        <span class="nav-label">Reels</span>
      </label>
    </div>

    <!-- Notification Item -->
    <div class="nav-item">
      <input type="radio" name="nav-group" id="notification">
      <label for="notification">
        <div class="icon-wrapper">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </div>
        <span class="nav-label">Notification</span>
      </label>
    </div>

    <!-- Profile Item -->
    <div class="nav-item">
      <input type="radio" name="nav-group" id="profile">
      <label for="profile">
        <div class="icon-wrapper">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <span class="nav-label">Profile</span>
      </label>
    </div>

  </nav>

</body>
</html>
