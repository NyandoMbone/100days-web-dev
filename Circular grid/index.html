<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Navigator Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="menu-container">
    <!-- Hidden Radio Buttons to track active states without JS -->
    <input type="radio" name="navigator-menu" id="item-cube" checked>
    <input type="radio" name="navigator-menu" id="item-settings">
    <input type="radio" name="navigator-menu" id="item-database">
    <input type="radio" name="navigator-menu" id="item-profile">
    <input type="radio" name="navigator-menu" id="item-layout">
    <input type="radio" name="navigator-menu" id="item-grid">

    <!-- The Outer Visual Ring and Background -->
    <div class="outer-ring">
      <div class="hover-indicator"></div>
    </div>

    <!-- Interactive Icon Labels -->
    <div class="menu-items">
      <!-- 1. Cube / Top -->
      <label for="item-cube" class="menu-item item-1" title="Navigator">
        <svg viewBox="0 0 24 24" class="icon"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </label>

      <!-- 2. Settings / Top Right -->
      <label for="item-settings" class="menu-item item-2" title="Settings">
        <svg viewBox="0 0 24 24" class="icon"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </label>

      <!-- 3. Database / Bottom Right -->
      <label for="item-database" class="menu-item item-3" title="Database">
        <svg viewBox="0 0 24 24" class="icon"><ellipse cx="12" cy="5" rx="9" ry="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 5v6c0 1.66 4 3 9 3s9-1.34 9-3V5M3 11v6c0 1.66 4 3 9 3s9-1.34 9-3v-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </label>

      <!-- 4. Profile / Bottom -->
      <label for="item-profile" class="menu-item item-4" title="Profile">
        <svg viewBox="0 0 24 24" class="icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </label>

      <!-- 5. Layout / Bottom Left -->
      <label for="item-layout" class="menu-item item-5" title="Layout">
        <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 3v18M3 9h18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </label>

      <!-- 6. Grid / Top Left -->
      <label for="item-grid" class="menu-item item-6" title="Grid">
        <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="3" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </label>
    </div>

    <!-- Center Display HUD Area -->
    <div class="center-display">
      <div class="text-wrapper">
        <span class="title title-cube">NAVIGATOR</span>
        <span class="title title-settings">SETTINGS</span>
        <span class="title title-database">DATABASE</span>
        <span class="title title-profile">PROFILE</span>
        <span class="title title-layout">LAYOUT</span>
        <span class="title title-grid">GRID VIEW</span>
        <span class="subtitle">Select</span>
      </div>
    </div>
  </div>

</body>
</html>
