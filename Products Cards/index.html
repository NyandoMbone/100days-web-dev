<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mango Product Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    
    <!-- Card 1: Standard White Card -->
    <div class="product-card standard-card">
      <div class="image-container">
        <img src="https://i.pinimg.com/736x/75/f5/da/75f5dac060f5618685cffbceb0361e3d.jpg" alt="Alphonso Mangoes">
        <span class="badge discount">20% OFF</span>
        <div class="pagination-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
        </div>
      </div>
      
      <div class="card-content">
        <div class="card-header">
          <h2 class="product-title">Alphonso</h2>
          <span class="price">$20</span>
        </div>
        <p class="description">
          Loved worldwide for their sweetness, our Alphonso mangoes are a delicious delight wherever you are.
        </p>
        <div class="tags">
          <span class="tag">Best Seller</span>
          <span class="tag">5 left</span>
        </div>
        <button class="btn btn-dark">Add to cart</button>
      </div>
    </div>

    <!-- Card 2: Immersive Full-Gradient Card -->
    <div class="product-card immersive-card">
      <div class="image-container">
        <img src="https://i.pinimg.com/736x/75/f5/da/75f5dac060f5618685cffbceb0361e3d.jpg" alt="Alphonso Mangoes">
        <span class="badge discount">20% OFF</span>
        <div class="gradient-overlay"></div>
        <div class="pagination-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
        </div>
      </div>
      
      <div class="card-content">
        <div class="card-header">
          <h2 class="product-title">Alphonso</h2>
          <span class="price">$20</span>
        </div>
        <p class="description">
          Loved worldwide for their sweetness, our Alphonso mangoes are a delicious delight wherever you are.
        </p>
        <div class="tags">
          <span class="tag">Best Seller</span>
          <span class="tag">5 left</span>
        </div>
        <button class="btn btn-light">Add to cart</button>
      </div>
    </div>

  </div>

</body>
</html>
