 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <ul class="card">
            <li class="path">
                <div class="icon"><img src="target.png" class="img" alt="target icon"></div>
                <div class="action">
                    <h3>Define your Vision</h3>
                    <p>What do you want to achieve?</p>
                </div>
            </li>

            <li class="path">
                <div class="icon"><img src="checklist.png" class="img" alt="checklist icon"></div>
                <div class="action">
                    <h3>Research & Plan</h3>
                    <p>Gather information and resources</p>
                </div>
            </li>
            <li class="path">
                <div class="icon"><img src="engineering.png" class="img" alt="gear icon"></div>
                <div class="action">
                    <h3>Build & Create</h3>
                    <p>Start building your project</p>
                </div>
            </li>
            <li class="path">
                <div class="icon"><img src="check-mark.png" class="img" alt="check-mark icon"></div>
                <div class="action">
                    <h3>Review & Test</h3>
                    <p>Test everything before launch</p>
                </div>
            </li>
            <li class="path">
                <div class="icon"><img src="startup.png" class="img" alt="rocket icon"></div>
                <div class="action">
                    <h3>Launch & Share</h3>
                    <p>Go live and share with the world</p>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
