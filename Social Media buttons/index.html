<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Buttons with Tooltips</title>
  
  <!-- Working Font Awesome Icon CDN Link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Custom CSS File -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="social-menu">
    <!-- Facebook -->
    <div class="icon-item facebook">
      <span class="tooltip">Facebook</span>
      <div class="icon"><i class="fab fa-facebook-f"></i></div>
    </div>

    <!-- Twitter / X -->
    <div class="icon-item twitter">
      <span class="tooltip">Twitter</span>
      <div class="icon"><i class="fab fa-twitter"></i></div>
    </div>

    <!-- Instagram -->
    <div class="icon-item instagram">
      <span class="tooltip">Instagram</span>
      <div class="icon"><i class="fab fa-instagram"></i></div>
    </div>

    <!-- GitHub -->
    <div class="icon-item github">
      <span class="tooltip">Github</span>
      <div class="icon"><i class="fab fa-github"></i></div>
    </div>

    <!-- YouTube -->
    <div class="icon-item youtube">
      <span class="tooltip">YouTube</span>
      <div class="icon"><i class="fab fa-youtube"></i></div>
    </div>
  </div>

</body>
</html>
