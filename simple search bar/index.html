<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Bar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrap">
        <div class="search-bar">
            <input
            type="search"
            class="term"
            id="mySearch"
            name="q"
            placeholder="  Search the site..."
            size="30"
            />
            <button class="button">
                <img src="magnifying-glass.png">
            </button>
        </div>
    </div>
</body>
</html>
