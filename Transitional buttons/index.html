<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D UI Buttons Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="button-container">
        <!-- Variant 1: Pop Out / Lift Effect -->
        <div class="button-wrapper">
            <span class="label">Pop Out</span>
            <button class="btn btn-pop">HOVER</button>
        </div>

        <!-- Variant 2: Push Down / Compression Effect -->
        <div class="button-wrapper">
            <span class="label">Push Down</span>
            <button class="btn btn-push">HOVER</button>
        </div>

        <!-- Variant 3: Slide / Shift Effect -->
        <div class="button-wrapper">
            <span class="label">Floating Slide</span>
            <button class="btn btn-slide">HOVER</button>
        </div>
    </div>

</body>
</html>
