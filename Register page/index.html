<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="container">
        <h1>Register</h1>
        <p class="subtitle">Create new account</p>

        <form>
            <div class="input-group">
                <input type="text" placeholder="Full Name" required>
            </div>
            
            <div class="input-group">
                <input type="email" placeholder="username@gmail.com" required>
            </div>
            
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#" class="forgot-pass">Forgot password?</a>
            </div>
        </form>

        <div class="divider">Or continue with</div>

        <div class="social-login">
            <button class="social-btn"><img src="search.png"></button>
            <button class="social-btn"><img src="apple.png"></button>
            <button class="social-btn"><img src="facebook.png"></button>
        </div>

        <p class="footer-text">Already have an account? <a href="#" class="sign-up">Sign up</a></p>
    </div>

</body>
</html>
