<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Card Component</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts for clean typography -->
  <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

  <div class="card">
    <!-- Header tags section -->
    <div class="card-header">
      <span class="tag-status">Peace and quiet</span>
      <div class="tag-date">
        <span class="month">SEP</span>
        <span class="day">29</span>
      </div>
    </div>

    <!-- Main text content -->
    <div class="card-body">
      <h2>Discovering nature</h2>
      <p>Far from the city noise, the green mountains stretch endlessly into the horizon, blanketed with mist and silence.</p>
    </div>

    <!-- Background/Image container with text overlay -->
    <div class="card-image-container">
      <img src="https://i.pinimg.com/1200x/17/11/96/171196308de6eb1ef65acd254e91a9a7.jpg" alt="Lush green mountains" class="card-img">
      <div class="location-overlay">
        <span class="geo-icon">📍</span>
        <div class="location-text">
          <span class="place-name">Location</span>
          <span class="region-name">Coordinates, 000</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
