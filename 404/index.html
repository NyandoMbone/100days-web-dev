<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>404 Page Not Found</title>
</head>
<body>

  <div class="error-card">
    <!-- Header Navigation -->
    <header class="navbar">
      <div class="nav-logo">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#features">Features</a>
        <a href="#shop">Shop</a>
        <a href="#blog">Blog</a>
      </nav>
    </header>

    <!-- Content Area -->
    <div class="card-body">
      <!-- Left: Text content -->
      <main class="text-section">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">You weren’t meant to see this...</h2>
        <p class="error-message">
          Either the internet has broken or we couldn’t find the file that you were looking for.
        </p>
        <a href="#" class="btn-back">Take Me Back</a>
      </main>

      <!-- Right: Line art Illustration matching the image layout -->
      <div class="illustration-section">
        <svg class="fishing-art" viewBox="0 0 300 200" fill="none" xmlns="http://w3.org">
          <!-- Fishing Net / Hole structure -->
          <ellipse cx="140" cy="140" rx="65" ry="22" stroke="#7a8b9e" stroke-width="2.5" />
          <ellipse cx="140" cy="143" rx="65" ry="22" stroke="#7a8b9e" stroke-width="1.5" />
          <path d="M 203 145 L 265 175" stroke="#7a8b9e" stroke-width="3" stroke-linecap="round"/>
          
          <!-- Fishing Rod -->
          <path d="M 255 130 L 210 35" stroke="#7a8b9e" stroke-width="3" stroke-linecap="round"/>
          
          <!-- Fishing Reel Detail -->
          <circle cx="237" cy="115" r="7" stroke="#7a8b9e" stroke-width="2" fill="#ffffff" />
          <path d="M 237 111 A 4 4 0 0 1 241 115" stroke="#7a8b9e" stroke-width="1.5" fill="none"/>
          
          <!-- Fishing Line & Hook -->
          <path d="M 210 35 C 180 60, 185 100, 195 110" stroke="#7a8b9e" stroke-width="1" fill="none"/>
          <!-- Small Hook shape -->
          <path d="M 195 110 Q 192 115 196 118 Q 200 118 199 113" stroke="#7a8b9e" stroke-width="1.5" fill="none"/>
          
          <!-- Water ripples / generic details -->
          <circle cx="180" cy="118" r="1.5" fill="#7a8b9e" />
          <circle cx="210" cy="122" r="1.5" fill="#7a8b9e" />
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
